# Git hooks (managed by lefthook). Install with `nix develop --command lefthook install`.
#
# pre-commit: scan for secrets (trufflehog), check the house cops, and run the
# test suite (bin/test). All three are wrapped in `nix develop --command`
# because the hook fires outside the flake devshell, so trufflehog, lefthook
# and Ruby would not otherwise be on PATH.
pre-commit:
  commands:
    secrets:
      run: nix develop --command trufflehog git file://. --since-commit HEAD --only-verified --fail
    rubocop:
      run: nix develop --command bundle exec rubocop
    tests:
      run: nix develop --command bin/test
